# ---------------------------------------------------------------- storage
storage:
  name: "Synology DS920+"
  pools:
    - name: "volume1"
      layout: "SHR · 4 disks · 1-disk fault tolerance"
      used: "19 TiB used · 23 TiB free · 42 TiB usable"
      pct: 45
      groups:
        - {kind: hdd, count: 4, label: "data · SHR (RAID5)", sub: "24 + 20 + 16 + 12 TB", sub2: "WD Red · Seagate IronWolf · Exos"}
        - {kind: nvme, count: 1, label: "cache · read/write", sub: "Samsung 970 EVO Plus 500 GB", sub2: "volume1 cachedev"}
  shares:
    - {name: "media",      note: "Plex library · NFS to media VMs"}
    - {name: "downloads",  note: "SABnzbd incomplete/complete"}
    - {name: "docker",     note: "container appdata"}
    - {name: "homes",      note: "user shares"}
  footer: "nightly snapshots · PBS copy on nuc3 · second copy to Cloudflare R2"

# ---------------------------------------------------------------- media pipeline
pipeline:
  nodes:
    request:  {icon: overseerr, name: "Overseerr",  host: request,  vm: 958, ip: ".213", sub: "requests"}
    prowlarr: {icon: prowlarr,  name: "Prowlarr",   host: prowlarr, vm: 957, ip: ".212", sub: "indexers"}
    arrs:     {icon: sonarr,    name: "Sonarr + Radarr", vm: 957, ip: ".212", sub: "one VM, 4 apps"}
    sab:      {icon: sabnzbd,   name: "SABnzbd",    vm: 957, ip: ".212", sub: "downloads"}
    plex:     {icon: plex,      name: "Plex",       host: plex, vm: 959, ip: ".69", sub: "streams · iGPU"}
  shares:
    downloads: {name: "downloads share", pool: "volume1 · 19 / 42 TiB used", mounts: "VM 957 · 958"}
    media:     {name: "media share",     pool: "volume1 · 19 / 42 TiB used", mounts: "VM 957 · 959"}

# ---------------------------------------------------------------- fleet facts
fleet:
  title: "Fleet"
  note: "immutable by design: a config change means rebuilding the VM from git"
  facts:
    - {icon: flatcar, name: "50 Flatcar VMs", note: "Ignition-built · no hand edits"}
    - {icon: docker,  name: "7 LXCs",         note: "infra only: opencode, nebraska, auth, PBS, beszel"}
    - {icon: beszel,  name: "standard stack", note: "watchtower · diun · beszel-agent · telegraf"}
    - {icon: cloudflare, name: "canary → stable", note: "Nebraska staged rollouts, one group at a time"}
  hosts_title: "Public services"
  hosts_note: "every one behind the Cloudflare Tunnel, most gated by Access"
  public_hosts:
    [audiobookshelf, bazarr, beszel, change, chef, dash, dnssync, draw,
     git, glance, gotify, grafana, hoard, influx, it, joplin, linkwarden,
     mealie, memos, minecraft, n8n, observe, paste, patchmon, plex,
     plexstats, prometheus, prowlarr, pulse, radarr, readarr, request,
     rss, sabnzd, scan, smoke, sonarr, speed, stashapp, uptime, wallos]

# ---------------------------------------------------------------- monitoring
monitoring:
  - {icon: beszel,      name: "Beszel",       host: beszel,  note: "per-VM up/down + containers"}
  - {icon: grafana,     name: "Grafana",      host: grafana, note: "dashboards · alert rules"}
  - {icon: prometheus,  name: "Prometheus",   host: prometheus, note: "5y retention"}
  - {icon: influxdb,    name: "InfluxDB",     host: influx,  note: "telegraf fleet-metrics"}
  - {icon: uptime-kuma, name: "Uptime Kuma",  host: uptime,  note: "~94 HTTP/TCP monitors"}
  - {icon: gotify,      name: "Gotify",       host: gotify,  note: "push relay"}
  - {icon: pulse,       name: "Pulse",        host: pulse,   note: "Proxmox guest inventory"}
  - {icon: cloudflare,  name: "OpenObserve",  host: observe, note: "logs from every VM"}
