# Inventory for the homelab diagram. Everything the picture shows comes from this file.
# Facts were read live (2026-11-11) from: the UniFi UX Max API, `pvesh` on nuc1, the
# Synology NAS over SSH, internal-dns, Prometheus and docs/PORT-REGISTER.md.
# Public apps (behind the Cloudflare Tunnel) are shown as <host>.<domain>; everything
# else gets <name>.internal and stays monochrome-ish.

meta:
  title: "Homelab"
  title_redacted: "Homelab"
  date: "November 2026"
  watermark: "@xxdesmus"
  domain: "paine.pro"

redact:
  domain: true
  domain_placeholder: "example.com"
  ssid_names: true

vlans:   # order = table order
  - {key: "wan",   tag: "AT&T",     name: WAN,       subnet: "104.13.212.149",          color: "#f85149", note: "fiber · BGW320 in IP-passthrough"}
  - {key: "lan",   tag: "LAN",      name: LAN,       subnet: "192.168.7.0/24",            color: "#58a6ff", note: "native VLAN · everything trusted lives here"}
  - {key: "20",    tag: "VLAN 20",  name: IoT,       subnet: "192.168.20.0/24",           color: "#3fb950", note: "IoT only · 2.4 + 5 GHz · no LAN access"}
  - {key: "30",    tag: "VLAN 30",  name: Untrusted, subnet: "192.168.30.0/24",           color: "#bc8cff", note: "photo frames · 2.4 GHz only · internet only"}
  - {key: "ts",    tag: "Tailscale", name: TS,       subnet: "100.113.78.86",             color: "#39c5cf", note: "mesh for NAS + pbs-r2 · no port forwards"}

internet:
  isp: "AT&T Fiber"
  speed: {down: "~940 Mbit/s", up: "~900 Mbit/s"}
  cloud_services:
    - {icon: cloudflare, name: "Cloudflare", note: "DNS · Tunnel ingress · Access SSO on *.{domain}"}
    - {icon: tailscale,  name: "Tailscale",  note: "mesh · NAS + pbs-r2 + 4 nodes"}

# AT&T residential gateway: the only thing in front of the UX Max.
bgw:
  name: "AT&T gateway"
  type: "ONT + router"
  model: "BGW320-505"
  ip: "192.168.1.254"
  os: "AT&T firmware"
  note: "IP passthrough → UX Max WAN"
  wan_ip: "104.13.212.149"                     # shown only with --unredacted
  ports: ["Fiber", "WAN", "1G", "1G", "1G"]   # index 1 = the UX Max uplink

# UniFi UX Max: gateway + 4 more units acting as mesh APs.
uxmax:
  name: "UX Max"
  type: "gateway"
  model: "UniFi UX Max · Wi-Fi 7"
  ip: "192.168.7.1"
  internal: unifi
  os: "UniFi Network 5.2.10"
  hw:
    - {icon: glyph-nic, label: "WAN",     value: "10G RJ45",  sub: "AT&T BGW320 · 1G"}
    - {icon: glyph-nic, label: "LAN",     value: "2.5G RJ45", sub: "to TP-Link switches"}
    - {icon: glyph-antenna, label: "RADIO", value: "Wi-Fi 7", sub: "2.4 + 5 + 6 GHz"}
    - {icon: glyph-cpu, label: "CLIENTS", value: "125",       sub: "68 wired · 57 wireless"}
  internal_ip: "192.168.7.1"

# TP-Link switching (not UniFi-managed; only the UX Max gateway is).
switch:
  name: "TP-Link"
  type: "switching"
  model: "TP-Link gigabit switches"
  os: "unmanaged / web-managed"
  ip: "192.168.7.40 · .132 · .164"
  note: "three separate switches, all 1G"
  ports:
    - {name: "uplink",  to: "UX Max",       untagged: "lan"}
    - {name: "p1",      to: "NUC1",         untagged: "lan"}
    - {name: "p2",      to: "NUC2",         untagged: "lan"}
    - {name: "p3",      to: "NUC3",         untagged: "lan"}
    - {name: "p4",      to: "NUC4",         untagged: "lan"}
    - {name: "p5",      to: "Synology",     untagged: "lan"}
    - {name: "p6",      to: "dns1 / RPi4",  untagged: "lan"}
    - {name: "p7",      to: "switch .164",  untagged: "lan"}
    - {name: "p8",      to: "switch .132",  untagged: "lan"}

# Devices on the wire that are not Proxmox guests.
devices:
  nas:
    name: "Synology"
    type: "NAS"
    model: "DS920+ · 4-bay"
    ip: "192.168.7.167"
    internal: nas
    os: "DSM 7 · Celeron J4125 · 12 GB"
    icons: [synology]
    vlan: "lan"
  pi:
    name: "RPi4 pair"
    type: "DNS"
    model: "2× Raspberry Pi 4"
    ip: ".240 · .186"
    internal: dns1
    os: "AdGuard Home + cloudflared"
    icons: [raspberry-pi]
    vlan: "lan"
  aps:
    name: "UX Max mesh"
    type: "access points"
    model: "4× UX Max · Wi-Fi 7"
    ip: "192.168.7.60 · .154 · .169 · .174"
    internal: unifi
    os: "wireless uplink · 6 GHz"
    icons: [unifi]
    vlan: "lan"
    trunk: true
  pc:
    name: "Workstations"
    type: "clients"
    model: "Gaming PC · Mac mini M4"
    ip: "192.168.7.141 · .90"
    os: "Windows 11 · macOS"
    icons: [windows]
    vlan: "lan"

ssids:
  - {name: "KingArthurII",           redacted: "Home",      vlan: "lan", bands: "2.4 · 5 · 6 GHz"}
  - {name: "KingArthurII-IoT",       redacted: "IoT",       vlan: "20",  bands: "2.4 · 5 GHz"}
  - {name: "KingArthurII-Untrusted", redacted: "Untrusted", vlan: "30",  bands: "2.4 GHz"}

remote:
  name: "Remote access"
  note: "WireGuard on the Pi · udp/51820 · Tailscale mesh"

port_forwards:
  - {port: "51820", proto: "UDP", to: "dns1 (RPi4)", what: "WireGuard VPN"}
  - {port: "32400", proto: "TCP", to: "Plex",       what: "Plex direct play"}

